trigger:
  branches:
    include:
      - main
      - staging
  paths:
    include:
      - client/**
      - azure-functions/**
      - scripts/bootstrap.ps1
      - scripts/start-local-dev.ps1
      - .vscode/**
      - GBSV_DASHBOARD.code-workspace
      - package.json
      - package-lock.json
      - azure-pipelines-ci.yml

pr:
  branches:
    include:
      - main
      - staging
  paths:
    include:
      - client/**
      - azure-functions/**
      - scripts/bootstrap.ps1
      - scripts/start-local-dev.ps1
      - .vscode/**
      - GBSV_DASHBOARD.code-workspace
      - package.json
      - package-lock.json
      - azure-pipelines-ci.yml

variables:
  NodeVersion: "20.x"

stages:
  - stage: validate
    displayName: Validate Workspace
    jobs:
      - job: client
        displayName: Client build
        pool:
          name: gbsv-local-windows
        steps:
          - checkout: self
          - task: UseNode@1
            inputs:
              versionSpec: "$(NodeVersion)"
            displayName: Use Node.js $(NodeVersion)
          - task: Npm@1
            inputs:
              command: custom
              customCommand: ci
              workingDir: client
            displayName: Install client dependencies
          - task: Npm@1
            inputs:
              command: custom
              customCommand: run build
              workingDir: client
            displayName: Build client bundles

      - job: functions
        displayName: Azure Functions lint and test
        pool:
          name: gbsv-local-windows
        steps:
          - checkout: self
          - task: UseNode@1
            inputs:
              versionSpec: "$(NodeVersion)"
            displayName: Use Node.js $(NodeVersion)
          - task: Npm@1
            inputs:
              command: custom
              customCommand: ci
              workingDir: azure-functions
            displayName: Install Azure Functions dependencies
          - task: Npm@1
            inputs:
              command: custom
              customCommand: run lint
              workingDir: azure-functions
            displayName: Lint Azure Functions
          - task: Npm@1
            inputs:
              command: custom
              customCommand: run format:check
              workingDir: azure-functions
            displayName: Check formatting
          - task: Npm@1
            inputs:
              command: custom
              customCommand: test
              workingDir: azure-functions
            displayName: Run Azure Functions tests
