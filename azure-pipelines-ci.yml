trigger:
  branches:
    include:
      - main
      - staging
  paths:
    include:
      - client/**
      - azure-functions/**
      - scripts/bootstrap.ps1
      - scripts/start-local-dev.ps1
      - .vscode/**
      - GBSV_DASHBOARD.code-workspace
      - package.json
      - package-lock.json
      - azure-pipelines-ci.yml

pr:
  branches:
    include:
      - main
      - staging
  paths:
    include:
      - client/**
      - azure-functions/**
      - scripts/bootstrap.ps1
      - scripts/start-local-dev.ps1
      - .vscode/**
      - GBSV_DASHBOARD.code-workspace
      - package.json
      - package-lock.json
      - azure-pipelines-ci.yml

variables:
  NodeVersion: "20.x"

stages:
  - stage: validate
    displayName: Validate Workspace
    jobs:
      - job: client
        displayName: Client build
        pool:
          name: gbsv-local-windows
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: Install client dependencies
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: client
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" ci
          - task: PowerShell@2
            displayName: Build client bundles
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: client
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" run build

      - job: functions
        displayName: Azure Functions lint and test
        pool:
          name: gbsv-local-windows
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: Install Azure Functions dependencies
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: azure-functions
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" ci
          - task: PowerShell@2
            displayName: Lint Azure Functions
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: azure-functions
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" run lint
          - task: PowerShell@2
            displayName: Check formatting
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: azure-functions
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" run format:check
          - task: PowerShell@2
            displayName: Run Azure Functions tests
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: azure-functions
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" test
