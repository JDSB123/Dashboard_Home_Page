trigger: none
pr: none

parameters:
  - name: environment
    displayName: Target environment
    type: string
    default: prod
    values:
      - dev
      - staging
      - prod
  - name: skipWaf
    displayName: Skip WAF policy deployment
    type: boolean
    default: false
  - name: dryRun
    displayName: Dry run (what-if mode)
    type: boolean
    default: false

variables:
  AzureServiceConnection: "gbsv-dashboard-wif"
  ResourceGroup: "dashboard-gbsv-main-rg"
  Location: "eastus"

stages:
  - stage: frontdoor
    displayName: Front Door deployment
    jobs:
      - job: deploy
        displayName: Validate and deploy Front Door
        pool:
          name: gbsv-local-windows
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Validate or deploy Front Door Bicep
            inputs:
              azureSubscription: "$(AzureServiceConnection)"
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = "Stop"
                az bicep build --file infra/main.bicep
                $enableWaf = if ("${{ parameters.skipWaf }}" -eq "true") { "false" } else { "true" }
                if ("${{ parameters.dryRun }}" -eq "true") {
                  az deployment group what-if `
                    --resource-group "$(ResourceGroup)" `
                    --template-file infra/main.bicep `
                    --parameters infra/main.bicepparam `
                    --parameters environment=${{ parameters.environment }} `
                    --parameters enableWaf=$enableWaf
                } else {
                  $deploymentName = "frontdoor-${{ parameters.environment }}-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
                  az deployment group create `
                    --resource-group "$(ResourceGroup)" `
                    --name $deploymentName `
                    --template-file infra/main.bicep `
                    --parameters infra/main.bicepparam `
                    --parameters environment=${{ parameters.environment }} `
                    --parameters enableWaf=$enableWaf
                }
