trigger: none
pr: none

parameters:
  - name: environment
    displayName: Target environment
    type: string
    default: prod
    values:
      - dev
      - staging
      - prod
  - name: skipWaf
    displayName: Skip WAF policy deployment
    type: boolean
    default: false
  - name: dryRun
    displayName: Dry run (what-if mode)
    type: boolean
    default: false

variables:
  AzureServiceConnection: "gbsv-dashboard-wif"
  ResourceGroup: "dashboard-gbsv-main-rg"
  Location: "eastus"

stages:
  - stage: frontdoor
    displayName: Front Door deployment
    jobs:
      - job: deploy
        displayName: Validate and deploy Front Door
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Validate or deploy Front Door Bicep
            inputs:
              azureSubscription: "$(AzureServiceConnection)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az bicep build --file infra/main.bicep
                if [ "${{ parameters.dryRun }}" = "true" ]; then
                  az deployment group what-if \
                    --resource-group "$(ResourceGroup)" \
                    --template-file infra/main.bicep \
                    --parameters infra/main.bicepparam \
                    --parameters environment=${{ parameters.environment }} \
                    --parameters enableWaf=$([ "${{ parameters.skipWaf }}" = "true" ] && echo false || echo true)
                else
                  DEPLOYMENT_NAME="frontdoor-${{ parameters.environment }}-$(date +%Y%m%d-%H%M%S)"
                  az deployment group create \
                    --resource-group "$(ResourceGroup)" \
                    --name "${DEPLOYMENT_NAME}" \
                    --template-file infra/main.bicep \
                    --parameters infra/main.bicepparam \
                    --parameters environment=${{ parameters.environment }} \
                    --parameters enableWaf=$([ "${{ parameters.skipWaf }}" = "true" ] && echo false || echo true)
                fi
