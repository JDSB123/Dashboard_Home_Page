trigger:
  branches:
    include:
      - main
  paths:
    include:
      - client/**
      - azure-functions/**
      - infra/**
      - scripts/**
      - azure-pipelines-deploy.yml

pr: none

variables:
  NodeVersion: "20.x"
  AzureServiceConnection: "gbsv-dashboard-wif"
  ResourceGroup: "dashboard-gbsv-main-rg"
  StaticWebAppName: "gbsv-dashboard"
  ContainerAppName: "gbsv-orchestrator"
  ContainerAppsEnvironment: "gbsv-aca-env"
  AcrName: "gbsvregistry"
  AcrLoginServer: "gbsvregistry.azurecr.io"

stages:
  - stage: validate
    displayName: Pre-deploy validation
    jobs:
      - job: build_and_test
        displayName: Build client and test Functions
        pool:
          name: gbsv-local-windows
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: Install client dependencies
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: client
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" ci
          - task: PowerShell@2
            displayName: Build client bundles
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: client
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" run build
          - task: PowerShell@2
            displayName: Install Azure Functions dependencies
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: azure-functions
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" ci
          - task: PowerShell@2
            displayName: Run Azure Functions tests
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: azure-functions
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" test

  - stage: deploy_orchestrator
    displayName: Deploy orchestrator container
    dependsOn: validate
    condition: succeeded()
    jobs:
      - job: container_app
        displayName: Build, push, and update Container App
        pool:
          name: gbsv-local-windows
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Deploy Container App image
            inputs:
              azureSubscription: "$(AzureServiceConnection)"
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = "Stop"
                az acr login --name "$(AcrName)"
                $imageTag = "$(Build.SourceVersion)"
                $imageRef = "$(AcrLoginServer)/gbsv-orchestrator:$imageTag"
                docker build -t $imageRef -f azure-functions/Dockerfile azure-functions
                docker push $imageRef
                az containerapp env show `
                  --name "$(ContainerAppsEnvironment)" `
                  --resource-group "$(ResourceGroup)" | Out-Null
                az containerapp update `
                  --name "$(ContainerAppName)" `
                  --resource-group "$(ResourceGroup)" `
                  --image $imageRef

  - stage: deploy_static_web_app
    displayName: Deploy Static Web App
    dependsOn: deploy_orchestrator
    condition: succeeded()
    jobs:
      - job: static_web_app
        displayName: Deploy client and integrated API
        pool:
          name: gbsv-local-windows
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: Install client dependencies
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: client
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" ci
          - task: PowerShell@2
            displayName: Build client
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: client
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" run build
          - task: PowerShell@2
            displayName: Install API production dependencies
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: azure-functions
              script: |
                $ErrorActionPreference = "Stop"
                & "C:\Program Files\nodejs\npm.cmd" ci --omit=dev
          - task: DeleteFiles@1
            inputs:
              SourceFolder: azure-functions
              Contents: |
                GradePicks/**
                SignalRInfo/**
                __tests__/**
            displayName: Trim non-HTTP functions for SWA
          - task: AzureCLI@2
            name: fetchSwaToken
            displayName: Fetch Static Web App deployment token
            inputs:
              azureSubscription: "$(AzureServiceConnection)"
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = "Stop"
                $swaToken = az staticwebapp secrets list `
                  --name "$(StaticWebAppName)" `
                  --resource-group "$(ResourceGroup)" `
                  --query properties.apiKey -o tsv
                Write-Host "##vso[task.setvariable variable=SWADeploymentToken;issecret=true]$swaToken"
          - task: AzureStaticWebApp@0
            displayName: Deploy Azure Static Web App
            inputs:
              workingDirectory: "$(System.DefaultWorkingDirectory)"
              app_location: "client"
              api_location: "azure-functions"
              output_location: ""
              skip_app_build: true
              skip_api_build: true
              config_file_location: "client"
              azure_static_web_apps_api_token: "$(SWADeploymentToken)"
